name: Parking BeemyFlex

# "on" entre guillemets : sinon YAML le lit comme le booleen True et
# GitHub ne voit aucun declencheur.
"on":
  workflow_dispatch:
    inputs:
      target_hour:
        description: "Heure UTC d'ouverture (baisser pour tester)"
        default: "17"
      days_ahead:
        description: "Decalage de la date visee, en jours"
        default: "2"

  schedule:
    # A SUPPRIMER APRES LE TEST. Lundi (cron : lundi = 1), 3 fois par
    # heure. La date visee un lundi est J+2 = mercredi, hors JOURS_CIBLES :
    # le script sort en 5 secondes sans rien reserver.
    - cron: '9,29,49 * * * 1'

    # Reservation a J+2 : samedi -> lundi, dimanche -> mardi, mardi -> jeudi.
    # (cron : dimanche = 0, lundi = 1 ... samedi = 6)
    # Minutes decalees : les heures rondes et les demies sont les creneaux
    # les plus charges chez GitHub, donc les plus souvent abandonnes.
    # Un seul run tire a T+0, les deux autres sont des relais qui se
    # retirent si une place a deja ete obtenue.
    - cron: '27 15 * * 0,1,2,6'   # principal -> 17:00:00
    - cron: '33 16 * * 0,1,2,6'   # relais 1  -> 17:00:25
    - cron: '51 16 * * 0,1,2,6'   # relais 2  -> 17:00:50

jobs:
  reserver:
    runs-on: ubuntu-latest
    timeout-minutes: 130       # attente de 1h33 + veille + marge

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check --quiet requests

      - name: Lancer la resa
        env:
          PYTHONUNBUFFERED: '1'
          BEEMYFLEX_TOKEN: ${{ secrets.BEEMYFLEX_TOKEN }}
          TARGET_HOUR: ${{ github.event.inputs.target_hour || '17' }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '2' }}

          # Seule variable vraiment pilotee par le YAML : elle empeche les
          # doublons. Un declenchement manuel, et le cron de test, valent 0.
          DELAI_SECOURS: >-
            ${{ (github.event.schedule == '33 16 * * 0,2,6' && '25')
             || (github.event.schedule == '51 16 * * 0,2,6' && '50')
             || '0' }}
        run: |
          echo "cron ${{ github.event.schedule || 'manuel' }} / demarrage $(date -u '+%H:%M:%S')Z"
          python test0109.py
